name: Publish Extension

# Gated, post-merge republish to the DuckDB community-extensions registry.
#
# This is the piece the DuckDB Version Monitor deliberately does NOT do: it bumps
# the pin and opens a PR, but publishing a new registry artifact has to happen
# AFTER that PR merges (the published description.yml `ref` must point at a commit
# that exists on `main`). This workflow performs that release:
#
#   gate -> fork-push preflight -> version bump -> changelog roll -> tag ->
#   description.yml sync -> CE PR
#
# It is intentionally MANUAL (workflow_dispatch) and runs in the `release`
# environment so a required reviewer must approve each publish. The approval is
# where a human confirms the registry is ready (see the registry-pin gate below).
#
# ── Required repo setup (one-time) ────────────────────────────────────────────
#   * An Environment named `release` with required reviewers
#     (Settings -> Environments). This is the human gate.
#   * Secret CE_PUBLISH_PAT: a PAT with `repo` scope that can push to your fork
#     `anentropic/community-extensions` AND open PRs against
#     `duckdb/community-extensions`. Falls back to VERSION_MONITOR_PAT. It is used
#     ONLY for that fork and PR: it is a personal token, and the s-layer org
#     refuses it for this repo (the v0.14.0 push failed with a 403 that way).
#   * The release commits + tag go to this repo's `main` with the job's own
#     GITHUB_TOKEN (`contents: write` above). If `main` becomes branch-protected,
#     allow github-actions to push to it (or relax protection for this actor).
# ──────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.10.4). Leave blank to auto-bump the patch component of the current Cargo.toml version."
        required: false
        default: ""
      dry_run:
        description: "Build the release locally and show the diff, but do not push, tag, or open the CE PR."
        type: boolean
        default: false
      registry_pr_only:
        description: "Only open the community-extensions PR for the release already on main (Cargo.toml's version, already tagged). Use when a run tagged the release but failed to open the PR."
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  CE_FORK: anentropic/community-extensions
  CE_BRANCH: semantic-views
  CE_UPSTREAM: duckdb/community-extensions

jobs:
  publish:
    name: Publish to community-extensions
    runs-on: ubuntu-latest
    environment: release          # <- required-reviewer gate
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0          # need tags + full history for changelog/compare
          # This repo's own token pushes the release commits + tag. The personal
          # CE_PUBLISH_PAT is refused for s-layer repos; it is used only below,
          # for the community-extensions fork.
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. Resolve current + next version --------------------------------------
      - name: Resolve versions
        id: ver
        run: |
          CUR=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$CUR" ]; then echo "could not read version from Cargo.toml" >&2; exit 1; fi
          IN="${{ github.event.inputs.version }}"
          if [ "${{ github.event.inputs.registry_pr_only }}" = "true" ]; then
            # The release is already committed and tagged: publish it as it is.
            if [ -n "$IN" ] && [ "$IN" != "$CUR" ]; then
              echo "::error::registry_pr_only publishes the version on main ($CUR), not $IN" >&2
              exit 1
            fi
            NEXT="$CUR"
          elif [ -n "$IN" ]; then
            NEXT="$IN"
          else
            IFS=. read -r MA MI PA <<< "$CUR"
            NEXT="${MA}.${MI}.$((PA + 1))"
          fi
          echo "current=$CUR"   >> "$GITHUB_OUTPUT"
          echo "next=$NEXT"     >> "$GITHUB_OUTPUT"
          echo "prev_tag=v$CUR" >> "$GITHUB_OUTPUT"
          echo "Publishing v$NEXT (previous v$CUR)"

      # 2. GATE: the registry must build our DuckDB pin ------------------------
      #    The registry builds every extension against its default DuckDB
      #    (`DUCKDB_LATEST_STABLE` in its build.yml), reading description.yml
      #    `repo.ref`, and keeps building some older DuckDB releases, each reading
      #    its own key (`variegata` for v1.5.6) per its scripts/build.py.
      #    `scripts/registry_target.py` maps our pin to that key, and refuses a pin
      #    the registry does not build, since that would only produce a failing
      #    registry build.
      - name: Gate — registry builds our DuckDB pin
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OURS=$(cat .duckdb-version)
          gh api "repos/${{ env.CE_UPSTREAM }}/contents/.github/workflows/build.yml" --jq '.content' | base64 -d > "$RUNNER_TEMP/build.yml"
          gh api "repos/${{ env.CE_UPSTREAM }}/contents/scripts/build.py" --jq '.content' | base64 -d > "$RUNNER_TEMP/build.py"
          echo "repo pin (.duckdb-version): $OURS"
          if ! KEY=$(python3 scripts/registry_target.py key "$OURS" "$RUNNER_TEMP/build.yml" "$RUNNER_TEMP/build.py"); then
            echo "::error::the community-extensions registry does not build DuckDB $OURS (see above)"
            exit 1
          fi
          echo "description.yml key for $OURS: repo.$KEY"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      # 3. PREFLIGHT: the registry token can push to the fork ------------------
      #    Checked before anything is committed or tagged (and in a dry run), so a
      #    token that cannot push fails here instead of after the release is cut.
      #    `git push --dry-run` sends nothing, but GitHub still asks for push
      #    access to answer it, so it is refused exactly as the real push would be.
      #    It runs from a scratch repo: this checkout's git config carries the
      #    GITHUB_TOKEN auth header for github.com, which would replace the PAT.
      - name: Preflight — the registry token can push to the fork
        env:
          GH_TOKEN: ${{ secrets.CE_PUBLISH_PAT || secrets.VERSION_MONITOR_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::neither CE_PUBLISH_PAT nor VERSION_MONITOR_PAT is set"
            exit 1
          fi
          PROBE="$RUNNER_TEMP/ce-preflight"
          git init -q "$PROBE"
          git -C "$PROBE" -c user.name=preflight -c user.email=preflight@localhost \
            commit -q --allow-empty -m preflight
          if ! git -C "$PROBE" push --dry-run \
              "https://x-access-token:${GH_TOKEN}@github.com/${CE_FORK}.git" \
              "HEAD:refs/heads/${CE_BRANCH}-preflight"; then
            echo "::error::the token cannot push to ${CE_FORK}. CE_PUBLISH_PAT must be a token of the fork's owner with write access to it: a classic PAT with the public_repo scope, or a fine-grained PAT whose resource owner is the fork's owner, with ${CE_FORK} selected and Contents set to read and write. Fix the secret, then run again (with registry_pr_only if the release is already tagged)."
            exit 1
          fi
          echo "the token can push to ${CE_FORK}"

      # 4. Changelog roll + version bump in this repo --------------------------
      - name: Roll changelog and bump version
        if: ${{ github.event.inputs.registry_pr_only != 'true' }}
        run: |
          NEXT="${{ steps.ver.outputs.next }}"
          PREV_TAG="${{ steps.ver.outputs.prev_tag }}"
          DATE=$(date -u +%Y-%m-%d)
          python3 scripts/changelog_release.py "$NEXT" "$DATE" "$PREV_TAG"
          # Cargo.toml: first `version = "..."` line is the package version.
          sed -i "0,/^version = \"/{s/^version = \"[^\"]*\"/version = \"$NEXT\"/}" Cargo.toml
          # Keep Cargo.lock's own-package entry in sync (no cargo run needed).
          sed -i "/^name = \"semantic_views\"$/{n;s/^version = \".*\"/version = \"$NEXT\"/}" Cargo.lock
          sed -i "s/^  version: .*/  version: $NEXT/" description.yml

      - name: Show diff (dry run inspection)
        run: git --no-pager diff

      # 5. Commit + tag the release, then sync description.yml ref --------------
      #    Mirrors `just release`: the release commit is tagged, then a follow-up
      #    commit points description.yml at the tagged commit's SHA, under the key
      #    the gate chose (`ref`, or an older DuckDB line's key such as `variegata`).
      - name: Commit, tag, and push
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.registry_pr_only != 'true' }}
        run: |
          NEXT="${{ steps.ver.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md Cargo.toml Cargo.lock description.yml
          git commit -m "chore: release v$NEXT"
          git tag "v$NEXT"
          SHA=$(git rev-parse HEAD)

          # Point description.yml at the tagged release commit, then commit that.
          python3 scripts/registry_target.py set description.yml "${{ steps.target.outputs.key }}" "$SHA"
          git add description.yml
          git commit -m "chore: update description.yml for v$NEXT release"

          git push origin main
          git push origin "v$NEXT"
          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"

      # 5b. registry_pr_only: the release is already tagged. Take its SHA from the
      #     tag and check that description.yml on main already points at it.
      - name: Find the tagged release
        if: ${{ github.event.inputs.registry_pr_only == 'true' }}
        run: |
          NEXT="${{ steps.ver.outputs.next }}"
          if ! SHA=$(git rev-parse --verify --quiet "v$NEXT^{commit}"); then
            echo "::error::tag v$NEXT does not exist; run without registry_pr_only to cut the release"
            exit 1
          fi
          KEY="${{ steps.target.outputs.key }}"
          if ! grep -qE "^  ${KEY}: ${SHA}\$" description.yml; then
            echo "::error::description.yml on main does not point repo.${KEY} at v$NEXT ($SHA)"
            exit 1
          fi
          echo "RELEASE_SHA=$SHA" >> "$GITHUB_ENV"

      # 6. Open the community-extensions PR from the fork ----------------------
      - name: Open community-extensions PR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CE_PUBLISH_PAT || secrets.VERSION_MONITOR_PAT }}
        run: |
          NEXT="${{ steps.ver.outputs.next }}"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${CE_FORK}.git" ce-fork
          cd ce-fork
          git remote add upstream "https://github.com/${CE_UPSTREAM}.git"
          git fetch upstream main
          # Fresh branch off upstream/main so the PR is a clean one-file change.
          git checkout -B "$CE_BRANCH" upstream/main
          mkdir -p extensions/semantic_views
          cp ../description.yml extensions/semantic_views/description.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/semantic_views/description.yml
          git commit -m "Update semantic_views to v$NEXT"
          git push --force -u origin "$CE_BRANCH"
          # The force-push updates an open PR from this branch in place.
          OPEN=$(gh pr list --repo "$CE_UPSTREAM" --head "$CE_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$OPEN" ]; then
            echo "updated the open community-extensions PR: $OPEN"
            exit 0
          fi
          gh pr create \
            --repo "$CE_UPSTREAM" \
            --head "anentropic:$CE_BRANCH" \
            --base main \
            --title "Update semantic_views to v$NEXT" \
            --body "Update semantic_views extension to v$NEXT (repo.${{ steps.target.outputs.key }}: ${RELEASE_SHA}, for DuckDB $(cat ../.duckdb-version))."

      - name: Summary
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          echo "### Published v${{ steps.ver.outputs.next }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- tag pushed: \`v${{ steps.ver.outputs.next }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- description.yml repo.${{ steps.target.outputs.key }}: \`${RELEASE_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- community-extensions PR opened from \`anentropic:${CE_BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
