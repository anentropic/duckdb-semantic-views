# Punctuation and markup conventions enforced across docs/
conventions:
  - rule: "Parenthetical dashes are written -- (RST), never a literal em dash."
  - rule: >-
      NON ADDITIVE BY and USING precede AS in a metric entry:
      <alias>.<name> [USING (...)] [NON ADDITIVE BY (...)] AS <expr>.
      Verified in src/body_parser/mod.rs:461. The after-AS form is a
      define-time error and must appear in docs only as a counter-example.
  - rule: >-
      The data_type column reports a declared type only; no surface declares
      one and nothing infers one. Empty for every view created since v0.10.0.
  - rule: "No internal tracker IDs (TECH-DEBT #NN, RT-N, C-N) in docs/."
  - rule: >-
      American spelling (behavior, modeling, labeled, recognized). RST labels
      that already use British spelling (explanation-grain-modelling) keep it,
      because renaming a label breaks every reference to it.
  - rule: >-
      Headings use title case, except the per-error entries on
      reference/error-messages.rst, which are consistently sentence case.
  - rule: >-
      Parameter layout: statement reference pages use definition lists;
      function reference pages use a Parameter / Type / Description list-table.
  - rule: >-
      How-to layout: Title -> (versionadded, when page-level) -> intro ->
      **Prerequisites:** -> task sections -> Troubleshooting (definition-list
      entries: bold symptom, indented body) -> Related.

overrides: {}
